workflows:
  flutter-ios:
    name: Flutter iOS build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Analyze
        script: |
          flutter analyze
      - name: Run tests
        script: |
          if [ -d test ]; then
            echo "Running tests..."
            flutter test
          else
            echo "No test directory found — skipping tests."
          fi
      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
      - build/ios/ipa/*.ipa
